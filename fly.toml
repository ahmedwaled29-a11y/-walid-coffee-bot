# fly.toml app configuration file generated for walid-coffee-bot on 2026-11-08T21:29:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'walid-coffee-bot'
primary_region = 'cdg'

[build]
  builder = 'paketobuildpacks/builder:base'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
